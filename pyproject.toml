[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "projectkate"
version = "0.3.1"
description = "KATE SDK — auto-eval, observability, and knowledge marketplace for AI agents"
authors = [{ name = "Sagnik", email = "sagnik@projectkate.com" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.30,<1",
    "openai>=1.30,<2",
    "deepeval>=1.0,<3",
    "httpx>=0.27,<1",
    "rich>=13.0,<14",
    "aiosqlite>=0.20,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
instrument = [
    "opentelemetry-api>=1.20,<3",
    "opentelemetry-sdk>=1.20,<3",
]
openai = [
    "opentelemetry-api>=1.20,<3",
    "opentelemetry-sdk>=1.20,<3",
    "openinference-instrumentation-openai>=0.1.4,<1",
]
anthropic-instrument = [
    "opentelemetry-api>=1.20,<3",
    "opentelemetry-sdk>=1.20,<3",
    "openinference-instrumentation-anthropic>=0.1.2,<1",
]
langchain = [
    "opentelemetry-api>=1.20,<3",
    "opentelemetry-sdk>=1.20,<3",
    "openinference-instrumentation-langchain>=0.1.25,<1",
]
mistral = [
    "opentelemetry-api>=1.20,<3",
    "opentelemetry-sdk>=1.20,<3",
    "openinference-instrumentation-mistralai>=0.1.0,<1",
]
vertexai = [
    "opentelemetry-api>=1.20,<3",
    "opentelemetry-sdk>=1.20,<3",
    "openinference-instrumentation-vertexai>=0.1.0,<1",
]
google-genai = [
    "opentelemetry-api>=1.20,<3",
    "opentelemetry-sdk>=1.20,<3",
    "openinference-instrumentation-google-generativeai>=0.1.0,<1",
]
crewai = [
    "opentelemetry-api>=1.20,<3",
    "opentelemetry-sdk>=1.20,<3",
    "openinference-instrumentation-crewai>=0.1.0,<1",
]
all = [
    "opentelemetry-api>=1.20,<3",
    "opentelemetry-sdk>=1.20,<3",
    "openinference-instrumentation-openai>=0.1.4,<1",
    "openinference-instrumentation-anthropic>=0.1.2,<1",
    "openinference-instrumentation-langchain>=0.1.25,<1",
    "openinference-instrumentation-mistralai>=0.1.0,<1",
    "openinference-instrumentation-vertexai>=0.1.0,<1",
    "openinference-instrumentation-google-generativeai>=0.1.0,<1",
    "openinference-instrumentation-crewai>=0.1.0,<1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["projectkate"]

[project.urls]
Homepage = "https://www.projectkate.com"
Repository = "https://github.com/thekateproject/kate-sdk"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
